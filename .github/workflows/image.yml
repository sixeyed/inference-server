# Tests, then a multi-arch image on GHCR.
#
# Each architecture builds on its own native runner (no QEMU) and runs the
# suite inside the image first - the `test` stage - so what is pushed is what
# was tested. Pull requests build and test but push nothing. Every push to
# main or a tag publishes; `latest` only moves on main.
name: image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    # The suite natively on macOS too: the sandbox scenarios need sandbox-exec,
    # which the Linux image does not have. Both ends of the supported range:
    # 3.9 is what macOS's Command Line Tools ship, and PREREQS says it's enough.
    strategy:
      matrix:
        python: ['3.9', '3.14']
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Test in the image
        run: docker build --target test -t inference-test .

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: github.event_name != 'pull_request'
        run: |
          tag="$IMAGE:${{ github.sha }}-${{ matrix.arch }}"
          docker build --build-arg GIT_SHA="${GITHUB_SHA::7}" -t "$tag" .
          docker push "$tag"

  manifest:
    if: github.event_name != 'pull_request'
    needs: [test, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Join the architectures
        run: |
          version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          tags="-t $IMAGE:${{ github.sha }} -t $IMAGE:sha-${GITHUB_SHA::7}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            tags="$tags -t $IMAGE:$version -t $IMAGE:latest"
          fi
          case "${{ github.ref }}" in
            refs/tags/v*) tags="$tags -t $IMAGE:${GITHUB_REF_NAME#v}" ;;
          esac
          # $tags unquoted on purpose: it is a list of flags.
          docker buildx imagetools create $tags \
            "$IMAGE:${{ github.sha }}-amd64" \
            "$IMAGE:${{ github.sha }}-arm64"
